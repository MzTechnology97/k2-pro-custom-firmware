name: K2 OpenHost - one-shot source startup hardening

on:
  push:
    branches: [k2-openhost]
    paths:
      - .github/workflows/k2-openhost-startup-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: k2-openhost
          fetch-depth: 0

      - name: Apply K2 Pro startup hardening patch
        run: |
          python3 tools/patch-k2-pro-startup-hardening.py
          python3 -m py_compile extras/motor_control.py
          grep -nE 'startup_delay|retry_delay|STARTUP_PROBE_ADDRS' extras/motor_control.py | head -40

      - name: Commit source extra and remove one-shot workflow
        run: |
          git config user.name "MzTechnology97"
          git config user.email "86824210+MzTechnology97@users.noreply.github.com"
          git rm .github/workflows/k2-openhost-startup-hardening.yml
          git add extras/motor_control.py extras/manifest.json tools/patch-k2-pro-startup-hardening.py
          git commit -m "k2-openhost: harden K2 Pro motor startup timing"
          git push origin HEAD:k2-openhost
