name: K2 OpenHost - one-shot K2 Pro motor-control adaptation

on:
  push:
    branches:
      - k2-openhost
    paths:
      - .github/workflows/k2-pro-motor-control-one-shot.yml

permissions:
  contents: write

jobs:
  patch-motor-control:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout k2-openhost
        uses: actions/checkout@v4
        with:
          ref: k2-openhost
          fetch-depth: 0

      - name: Apply K2 Pro motor-control topology patch
        run: python3 tools/patch-k2-pro-motor-control.py

      - name: Validate patched motor control
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile extras/motor_control.py
          grep -Fq 'KINEMATIC_AXES = ("x", "y")' extras/motor_control.py
          grep -Fq 'STARTUP_PROBE_ADDRS = (0x81, 0x82)' extras/motor_control.py
          grep -Fq 'K2_PRO_CLOSED_LOOP_AXES = ("x", "y", "e")' extras/motor_control.py
          grep -Fq 'startup_retry_limit = self.config_model.startup_retries' extras/motor_control.py

      - name: Commit K2 Pro adaptation and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/k2-pro-motor-control-one-shot.yml
          git config user.name 'MzTechnology97'
          git config user.email '86824210+MzTechnology97@users.noreply.github.com'
          git add extras/motor_control.py extras/manifest.json tools/patch-k2-pro-motor-control.py .github/workflows/k2-pro-motor-control-one-shot.yml
          git commit -m 'k2-openhost: adapt motor control to K2 Pro XY+E topology'
          git push origin HEAD:k2-openhost
