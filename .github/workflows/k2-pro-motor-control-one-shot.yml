name: K2 OpenHost - one-shot K2 Pro motor-control adaptation

on:
  push:
    branches:
      - k2-openhost
    paths:
      - .github/workflows/k2-pro-motor-control-one-shot.yml

permissions:
  contents: write

jobs:
  patch-motor-control:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout k2-openhost
        uses: actions/checkout@v4
        with:
          ref: k2-openhost
          fetch-depth: 0

      - name: Adapt bundled motor_control.py for K2 Pro
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          path = Path('extras/motor_control.py')
          text = path.read_text()

          def replace_region(source, start_marker, end_marker, replacement):
              start = source.index(start_marker)
              end = source.index(end_marker, start)
              return source[:start] + replacement.rstrip() + '\n\n' + source[end:]

          config_model = r'''K2_PRO_CLOSED_LOOP_AXES = ("x", "y", "e")

K2_PIN_LAYOUT = {
    "motor_x_dir": ("PB9", 0),
    "motor_x_step": ("PB10", 0),
    "motor_x_stall": ("PB11", None),
    "motor_y_dir": ("!PB7", 0),
    "motor_y_step": ("PB8", 0),
    "motor_y_stall": ("PB12", None),
    "motor_e_stall": ("nozzle_mcu:PB12", None),
}

PIN_OPTIONS = tuple(K2_PIN_LAYOUT)

OUTPUT_PIN_OPTIONS = (
    "motor_x_dir",
    "motor_x_step",
    "motor_y_dir",
    "motor_y_step",
)

CONTROL_OPTIONS = (
    "overcurrent_switch",
    "switch",
    "retries",
    "motor_closed_loop",
)


@dataclass(frozen=True)
class MotorPinConfig:
    raw: str
    pin_desc: str
    startup_value: int | None


@dataclass(frozen=True)
class MotorControlConfigModel:
    raw_options: dict[str, str | None]
    cut_pos_offset: float
    pins: dict[str, MotorPinConfig]
    closed_loop_axes: tuple[str, ...]
    startup_retries: int
    switch: int
    overcurrent_switch: int

    @staticmethod
    def _parse_pin(config, option, default_desc, default_startup):
        raw_value = config.get(option, None)
        if raw_value is None:
            return MotorPinConfig(
                raw=default_desc,
                pin_desc=default_desc,
                startup_value=default_startup,
            )
        parts = [part.strip() for part in str(raw_value).split(",")]
        if not parts or not parts[0] or len(parts) > 2:
            raise config.error(
                "Invalid %s=%r; expected PIN or PIN,0|1"
                % (option, raw_value))
        startup = default_startup
        if len(parts) == 2:
            try:
                startup = int(parts[1])
            except ValueError as exc:
                raise config.error(
                    "Invalid startup value in %s=%r" % (option, raw_value)) from exc
            if startup not in (0, 1):
                raise config.error(
                    "Invalid startup value in %s=%r; expected 0 or 1"
                    % (option, raw_value))
        return MotorPinConfig(
            raw=parts[0],
            pin_desc=parts[0],
            startup_value=startup,
        )

    @staticmethod
    def _parse_closed_loop_axes(config):
        raw_value = config.get(
            "motor_closed_loop", ",".join(K2_PRO_CLOSED_LOOP_AXES))
        requested = tuple(dict.fromkeys(
            part.strip().lower()
            for part in str(raw_value).split(",")
            if part.strip()
        ))
        unknown = [axis for axis in requested if axis not in K2_PRO_CLOSED_LOOP_AXES]
        if unknown:
            raise config.error(
                "K2 Pro motor_closed_loop contains unsupported axes: %s"
                % (",".join(unknown),))
        normalized = tuple(
            axis for axis in K2_PRO_CLOSED_LOOP_AXES if axis in requested)
        if normalized != K2_PRO_CLOSED_LOOP_AXES:
            raise config.error(
                "K2 Pro motor_closed_loop must select x,y,e; got %r"
                % (raw_value,))
        return normalized

    @classmethod
    def from_config(cls, config, param_options=()):
        accepted = {
            "cut_pos_offset",
            *(option.lower() for option in CONTROL_OPTIONS),
            *(option.lower() for option in PIN_OPTIONS),
            *(str(option).lower() for option in param_options),
        }
        raw = {
            option: config.get(option)
            for option in config.fileconfig.options(config.section)
            if option.lower() in accepted
        }
        pins = {
            option: cls._parse_pin(config, option, pin_desc, startup_value)
            for option, (pin_desc, startup_value) in K2_PIN_LAYOUT.items()
        }
        return cls(
            raw_options=raw,
            cut_pos_offset=config.getfloat("cut_pos_offset", 0.4),
            pins=pins,
            closed_loop_axes=cls._parse_closed_loop_axes(config),
            startup_retries=config.getint("retries", 3, minval=0, maxval=10),
            switch=config.getint("switch", 1, minval=0, maxval=1),
            overcurrent_switch=config.getint(
                "overcurrent_switch", 0, minval=0, maxval=1),
        )'''

          text = replace_region(
              text,
              'K2_PIN_LAYOUT = {',
              '# ──────────────────────────────────────────────────────────────────────────\n# motor_cut_calibration',
              config_model,
          )

          pin_sequences = r'''PIN_DIR_SEQUENCE = (
    ("motor_x_dir", 0),
    ("motor_x_step", 0),
    ("motor_y_dir", 0),
    ("motor_y_step", 0),
)

PIN_NORMAL_SEQUENCE = (
    ("motor_x_dir", 0),
    ("motor_x_step", 0),
    ("motor_y_dir", 1),
    ("motor_y_step", 0),
)'''
          text = replace_region(
              text,
              'PIN_DIR_SEQUENCE = (',
              'def _shareable_pin_desc',
              pin_sequences,
          )

          axis_model = r'''KINEMATIC_AXES = ("x", "y")
EXTRUDER_AXIS = "e"
ALL_AXES = KINEMATIC_AXES + (EXTRUDER_AXIS,)
EXTRUDER_AXES = (EXTRUDER_AXIS,)
AXIS_NUM_MAP = {
    1: "x",
    2: "y",
    5: EXTRUDER_AXIS,
}
AXIS_TO_NUM_MAP = {axis: num for num, axis in AXIS_NUM_MAP.items()}
STARTUP_PROBE_ADDRS = (0x81, 0x82)
EXTRUDER_BOOTSTRAP_ADDR = 0x81
EXTRUDER_MIN_RUNTIME_ADDR = 0x81
EXTRUDER_MAX_RUNTIME_ADDR = 0x8F
STAGED_CALIBRATION_AXES = EXTRUDER_AXES
RUNTIME_FAULT_ACTION_SHUTDOWN = "shutdown"
RUNTIME_FAULT_ACTION_RECOVER = "recover"
RUNTIME_FAULT_ACTION_BY_AXIS = {
    **{axis: RUNTIME_FAULT_ACTION_SHUTDOWN for axis in KINEMATIC_AXES},
    EXTRUDER_AXIS: RUNTIME_FAULT_ACTION_RECOVER,
}'''
          text = replace_region(
              text,
              'KINEMATIC_AXES = ("x", "y", "z", "z1")',
              '@dataclass(frozen=True)\nclass MotorAxisTarget',
              axis_model,
          )

          stall_pins = r'''STALL_AXIS_PINS = (
    ("x", "motor_x_stall"),
    ("y", "motor_y_stall"),
    (EXTRUDER_AXIS, "motor_e_stall"),
)'''
          text = replace_region(
              text,
              'STALL_AXIS_PINS = (',
              'class MotorStallMonitor:',
              stall_pins,
          )

          old_map = '''STARTUP_SERIAL_AXIS_BY_ADDR = {\n    0x81: "X",\n    0x82: "Y",\n    0x83: "Z",\n    0x84: "Z1",\n}'''
          new_map = '''STARTUP_SERIAL_AXIS_BY_ADDR = {\n    0x81: "X",\n    0x82: "Y",\n}'''
          if old_map not in text:
              raise SystemExit('startup serial map marker not found')
          text = text.replace(old_map, new_map, 1)

          old_retry_init = '''        self.motor_params_init = False\n        self.auto_retry = True\n        self.cut_pos_offset = self.config_model.cut_pos_offset'''
          new_retry_init = '''        self.motor_params_init = False\n        self.auto_retry = True\n        self.startup_retry_limit = self.config_model.startup_retries\n        self.cut_pos_offset = self.config_model.cut_pos_offset'''
          if old_retry_init not in text:
              raise SystemExit('retry init marker not found')
          text = text.replace(old_retry_init, new_retry_init, 1)

          text = text.replace(
              'self._startup_auto_retry_count < STARTUP_AUTO_RETRY_LIMIT',
              'self._startup_auto_retry_count < self.startup_retry_limit',
              1,
          )
          text = text.replace(
              'next_retry,\n                            STARTUP_AUTO_RETRY_LIMIT,',
              'next_retry,\n                            self.startup_retry_limit,',
              1,
          )
          text = text.replace(
              'self._startup_auto_retry_count, STARTUP_AUTO_RETRY_LIMIT)',
              'self._startup_auto_retry_count, self.startup_retry_limit)',
              1,
          )

          text = text.replace(
              '"MOTOR_CALIBRATE AXIS=XYZZ1 [DETAIL=raw] | MOTOR_CALIBRATE AXIS=E STAGE=encoder|offset|1|2 [DETAIL=raw]"',
              '"MOTOR_CALIBRATE AXIS=XY [DETAIL=raw] | MOTOR_CALIBRATE AXIS=E STAGE=encoder|offset|1|2 [DETAIL=raw]"',
              1,
          )
          text = text.replace(
              '"MOTOR_CFG_OVERRIDE_STATUS [AXIS=XYZZ1E] [DETAIL=raw] Report live cfg-backed targets and current board values"',
              '"MOTOR_CFG_OVERRIDE_STATUS [AXIS=XYE] [DETAIL=raw] Report live cfg-backed targets and current board values"',
              1,
          )
          text = text.replace(
              'f"unsupported AXIS={raw_value!r}; use X,Y,Z,Z1,E"',
              'f"unsupported AXIS={raw_value!r}; use X,Y,E"',
              1,
          )
          text = text.replace(
              '            "MOTOR_CALIBRATE AXIS=XYZZ1",\n',
              '',
              1,
          )

          topology_log_marker = '''        if self._runtime_cfg_overrides:\n            _klog(\n                "loaded %d live cfg param override(s) into runtime registry",\n                len(self._runtime_cfg_overrides),\n            )'''
          topology_log_replacement = topology_log_marker + '''\n        _klog(\n            "K2 Pro topology closed_loop=%s retries=%d switch=%d overcurrent_switch=%d",\n            ",".join(self.config_model.closed_loop_axes),\n            self.config_model.startup_retries,\n            self.config_model.switch,\n            self.config_model.overcurrent_switch,\n        )'''
          if topology_log_marker not in text:
              raise SystemExit('topology log marker not found')
          text = text.replace(topology_log_marker, topology_log_replacement, 1)

          # Guard the branch against accidental reintroduction of K2 Plus Z/Z1
          # serial-motor topology.
          if 'KINEMATIC_AXES = ("x", "y")' not in text:
              raise SystemExit('K2 Pro kinematic axis topology patch failed')
          if 'STARTUP_PROBE_ADDRS = (0x81, 0x82)' not in text:
              raise SystemExit('K2 Pro startup probe topology patch failed')
          if '"motor_z_dir": ("PB5", 0)' in text[:12000]:
              raise SystemExit('K2 Plus Z output pin still present in K2 Pro config model')

          path.write_text(text)

          manifest_path = Path('extras/manifest.json')
          manifest = json.loads(manifest_path.read_text())
          raw = path.read_bytes()
          entry = manifest['files']['motor_control.py']
          entry['sha256'] = hashlib.sha256(raw).hexdigest()
          entry['size'] = len(raw)
          manifest['version'] = '6.19'
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n')
          PY

      - name: Validate patched motor control
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile extras/motor_control.py
          grep -Fq 'KINEMATIC_AXES = ("x", "y")' extras/motor_control.py
          grep -Fq 'STARTUP_PROBE_ADDRS = (0x81, 0x82)' extras/motor_control.py
          grep -Fq 'K2_PRO_CLOSED_LOOP_AXES = ("x", "y", "e")' extras/motor_control.py
          grep -Fq 'startup_retry_limit = self.config_model.startup_retries' extras/motor_control.py

      - name: Commit K2 Pro adaptation and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/k2-pro-motor-control-one-shot.yml
          git config user.name 'MzTechnology97'
          git config user.email '86824210+MzTechnology97@users.noreply.github.com'
          git add extras/motor_control.py extras/manifest.json .github/workflows/k2-pro-motor-control-one-shot.yml
          git commit -m 'k2-openhost: adapt motor control to K2 Pro XY+E topology'
          git push origin HEAD:k2-openhost
