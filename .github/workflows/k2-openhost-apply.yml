name: Apply K2-OpenHost validated patches

on:
  push:
    branches:
      - k2-openhost
    paths:
      - 'patches/k2-openhost/**'
      - '.github/workflows/k2-openhost-apply.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout k2-openhost
        uses: actions/checkout@v4
        with:
          ref: k2-openhost
          fetch-depth: 0

      - name: Apply SHA-gated validated patchset
        shell: bash
        run: |
          set -euo pipefail
          sh patches/k2-openhost/apply.sh

      - name: Verify Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile extras/box_protocol.py extras/box.py

      - name: Commit patched sources
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- extras/box_protocol.py extras/box.py; then
            echo 'Validated sources are already patched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add extras/box_protocol.py extras/box.py
          git commit -m 'k2-openhost: apply validated K2 Pro compatibility patches'
          git push origin HEAD:k2-openhost
