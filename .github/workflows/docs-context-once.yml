name: K2 OpenHost inherited docs context

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  annotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Annotate inherited documentation
        shell: bash
        run: |
          set -euo pipefail
          marker='<!-- K2-OPENHOST-FORK-CONTEXT -->'
          for f in docs/*.md; do
            case "$f" in
              docs/index.md|docs/openhost.md) continue ;;
            esac
            if grep -Fq "$marker" "$f"; then
              continue
            fi
            tmp="$(mktemp)"
            cat >"$tmp" <<'EOF'
<!-- K2-OPENHOST-FORK-CONTEXT -->
> **Fork / upstream context:** this page is preserved from **Jacob10383/Jacobean's `k2-plus-custom-firmware`** documentation and remains credited to the original project. It may describe the original K2 Plus full-firmware/T113-local workflow. For the current **K2 Pro / K2-OpenHost** architecture, start from [`docs/index.md`](index.md), [`docs/openhost.md`](openhost.md), and [MzTechnology97/K2-OpenHost](https://github.com/MzTechnology97/K2-OpenHost). K2 Plus values or procedures are not assumed to apply unchanged to K2 Pro.

EOF
            cat "$f" >>"$tmp"
            mv "$tmp" "$f"
          done

          git rm .github/workflows/docs-context-once.yml
          git config user.name 'MzTechnology97'
          git config user.email '86824210+MzTechnology97@users.noreply.github.com'
          git add docs
          git commit -m 'docs: mark inherited K2 Plus guides as upstream reference'
          git push origin HEAD:main
